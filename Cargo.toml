workspace = { members = [
  ".",
  # "admin-control-panel" 
] }

[package]
name = "web-img-manager"
version = "1.4.0"
edition = "2024"
authors = ["Serveny"]
license = "MIT"

[[bin]]
name = "web-img-manager"
path = "src/main.rs"

[features]
default = []
openssl = ["dep:openssl", "actix-web/openssl"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
actix = "0.13.5"
actix-web = { version = "4.15.0" }
actix-cors = "0.7.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
image = { version = "0.25.10", features = ["webp"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }
log = "0.4.34"
env_logger = "0.11.11"
actix-multipart = "0.8.4"
reqwest = { version = "0.13.5", features = ["json", "multipart", "form"] }
ts-rs = { version = "12.0.1", features = ["serde-compat", "uuid-impl"] }
image_hasher = "3.1.1"
openssl = { version = "0.10.81", features = ["vendored"], optional = true }
tokio = { version = "1.53.1" }
actix-ws = "0.4.0"
futures-util = "0.3.34"
webp = "0.3.1"
figment = { version = "0.10.19", features = ["env", "json"] }
